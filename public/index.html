<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopee Affiliate Bot</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">🛒</div>
        <h1>Shopee Affiliate Bot</h1>
      </div>
      <div class="header-right">
        <div class="ext-badge" id="extBadge">
          <span class="ext-dot" id="extDot"></span>
          <span id="extText">Extension: Chờ kết nối...</span>
        </div>
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Connecting...</span>
      </div>
    </header>

    <!-- Main Content -->
    <div class="main">
      <!-- Chat Panel -->
      <div class="chat-panel">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-typing" id="chatTyping" style="display:none">
          <div class="typing-dots"><span></span><span></span><span></span></div>
          <span>Bot đang xử lý...</span>
        </div>
        <div class="chat-input-area">
          <div class="command-hints" id="commandHints" style="display:none">
            <button class="hint-btn" data-cmd="/search ">/search</button>
            <button class="hint-btn" data-cmd="/link ">/link</button>
            <button class="hint-btn" data-cmd="/status">/status</button>
            <button class="hint-btn" data-cmd="/help">/help</button>
          </div>
          <div class="chat-input-wrapper">
            <input type="text" id="chatInput" placeholder="Gõ /help để bắt đầu..." autocomplete="off">
            <button id="sendBtn" title="Gửi">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Dashboard Panel -->
      <div class="dashboard-panel">
        <!-- Extension Status Card -->
        <div class="card">
          <h2 class="card-title">🔌 Extension Status</h2>
          <div class="status-grid">
            <div class="status-item">
              <span class="status-label">Trạng thái</span>
              <span class="status-value" id="extStatus">Chờ kết nối</span>
            </div>
            <div class="status-item">
              <span class="status-label">Hoạt động cuối</span>
              <span class="status-value" id="extLastSeen">--</span>
            </div>
          </div>
        </div>

        <!-- Zalo Bot Status Card -->
        <div class="card card-zalo">
          <h2 class="card-title">🤖 Zalo Bot</h2>
          <div class="status-grid">
            <div class="status-item">
              <span class="status-label">Trạng thái</span>
              <span class="status-value" id="zaloStatus">Đang khởi tạo...</span>
            </div>
            <div class="status-item">
              <span class="status-label">Tài khoản</span>
              <span class="status-value" id="zaloAccount">--</span>
            </div>
          </div>
          <div class="zalo-qr-section" id="zaloQrSection" style="display:none">
            <div class="zalo-qr-label">📱 Quét mã QR bằng Zalo để đăng nhập</div>
            <img id="zaloQrImage" class="zalo-qr-image" src="" alt="Zalo QR Code">
          </div>
          <div class="zalo-actions">
            <button class="action-btn zalo-restart-btn" id="zaloRestart">🔄 Khởi động lại</button>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="card">
          <h2 class="card-title">⚡ Thao tác nhanh</h2>
          <div class="quick-actions">
            <button class="action-btn" id="quickSearch">🔍 Test Search</button>
            <button class="action-btn" id="quickLink">🔗 Test Link</button>
            <button class="action-btn" id="quickStatus">📊 Status</button>
          </div>
        </div>

        <!-- Logs Card -->
        <div class="card card-logs">
          <h2 class="card-title">📋 Activity Logs</h2>
          <div class="logs-container" id="logsContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
